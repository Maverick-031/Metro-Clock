name: Build Android APK

on:
  workflow_dispatch: # Only runs when you press the button

permissions:
  contents: write # Required to create a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Rename APK with Version
      run: |
        # Extract versionName from app/build.gradle.kts (e.g., "1.0")
        VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts || echo "1.0")
        
        # Create a better name
        NEW_NAME="MetroClock-v${VERSION_NAME}-Build-${{ github.run_number }}.apk"
        
        # Rename the file
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/${NEW_NAME}
        
        # Save the name to be used in the next step
        echo "APK_NAME=${NEW_NAME}" >> $GITHUB_ENV

    - name: Upload APK to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }} # Creates a unique tag for each build
        name: MetroClock Build ${{ github.run_number }}
        body: |
          Automated build of MetroClock.
          Version: ${{ env.APK_NAME }}
          Commit: ${{ github.sha }}
        files: app/build/outputs/apk/debug/${{ env.APK_NAME }}
        draft: false
        prerelease: false
