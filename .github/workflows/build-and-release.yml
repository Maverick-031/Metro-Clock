name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK
      run: ./gradlew assembleRelease --info

    - name: Rename APK
      run: |
        APK_NAME="MetroClock-v${{ github.ref_name }}.apk"
        mv app/build/outputs/apk/release/app-release.apk "$APK_NAME"
        echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.APK_NAME }}
        name: Release ${{ github.ref_name }}
        body: |
          ## Changes in this release
          
          - Fixed package name from com.example to app.metroclock
          - Removed Firebase and Google Services dependencies
          - Fixed MetroSoundPicker implementation
          - Fixed MetroAppBar navigationBarsPadding
          - Fixed AlarmReceiver calendar helper reference
          - Fixed AddEditAlarmScreen preview sound URI handling
          - Fixed SettingsScreen unused imports
          - Fixed MainClockScreen METRO CLOCK styling
          - Added README.md file
          
          ## App Features
          
          - Alarms with custom repeat days, snooze, and sound selection
          - Timer with countdown and custom sound
          - Stopwatch with lap functionality
          - World Clock for different time zones
          - Smart Skip for location-aware alarm skipping
          - Calendar integration for skipping alarms on event days
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
